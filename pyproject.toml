[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcs-oracle-automation"
version = "0.1.0"
description = "AI-recorded, AI-free replay test automation for Oracle EBS (Java agent + Playwright)"
requires-python = ">=3.11"
dependencies = [
    # Browser automation
    "playwright>=1.44",
    # Local Java Forms agent is built from java-agent/.
    # MCP server
    "fastmcp>=0.1",
    # Excel I/O
    "openpyxl>=3.1",
    "pandas>=2.2",
    # YAML
    "pyyaml>=6.0",
    # Jinja2 templates (codegen)
    "jinja2>=3.1",
    # Screenshot / Windows / UI automation
    "pillow>=10.0",
    "pywin32>=306",
    "pyautogui>=0.9",
    # HTTP
    "aiohttp>=3.9",
    # Embeddings / FAISS (form fingerprint similarity search)
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    # Azure monitoring (telemetry)
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-api>=1.25",
    # Pytest ecosystem
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-html>=4.1",
    "pytest-xdist>=3.5",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
center = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
]
agent = [
    "httpx>=0.27",
]

[project.scripts]
qcs        = "qcs.__main__:main"
qcs-center = "qcs_center.app:main"
qcs-agent  = "qcs_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qcs*", "qcs_repo*", "qcs_replay*", "qcs_java_agent*", "generator*", "oracle_ai_agent*", "qcs_center*", "qcs_agent*"]

[tool.setuptools]
py-modules = ["config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["generated_tests"]
pythonpath = ["."]
addopts = "--html=reports/report.html --self-contained-html"

[tool.ruff]
line-length = 100
target-version = "py311"
